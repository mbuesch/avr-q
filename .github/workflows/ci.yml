name: Build and test

on:
  push:
  pull_request:

env: 
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test_generic:
    name: Test
    strategy:
      matrix:
        toolchain:
          - 1.91.0
          - nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ matrix.toolchain }}
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ matrix.toolchain }}

      - run: rustup update ${{ matrix.toolchain }}
      - run: rustup default ${{ matrix.toolchain }}
      - run: rustup component add clippy rustfmt
      - if: matrix.toolchain == 'nightly'
        run: rustup component add rust-src miri

      - if: matrix.toolchain == 'nightly'
        run: cargo fmt --all --check
        working-directory: avr-q
      - run: cargo clippy -- --deny warnings
        working-directory: avr-q
      - run: cargo clippy --tests -- --deny warnings
        working-directory: avr-q

      # With default features.
      - run: cargo build
        working-directory: avr-q
      - run: cargo test
        working-directory: avr-q
      - if: matrix.toolchain == 'nightly'
        run: cargo miri test
        working-directory: avr-q

      # With `curveipo` feature.
      - run: cargo build --features curveipo
        working-directory: avr-q
      - run: cargo test --features curveipo
        working-directory: avr-q
      - if: matrix.toolchain == 'nightly'
        run: cargo miri test --features curveipo
        working-directory: avr-q

